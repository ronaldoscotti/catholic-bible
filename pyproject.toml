[project]
name = "the-catholic-bible"
version = "2.0.0"
description = "A read-only API and a published dataset for the Catholic Bible."
readme = "README.md"
# The files rather than an SPDX expression. The code is MIT and the corpus is
# not, so a field that holds one identifier holds none of them honestly.
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[project.scripts]
catholic-bible-api = "catholic_bible.api.app:main"
# For an image that wants the store in a layer rather than rebuilt on every
# container start. `catholic-bible-api` does it on its own otherwise.
catholic-bible-build-db = "catholic_bible.storage.bootstrap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catholic_bible"]

[dependency-groups]
dev = [
    "httpx2",
    "mypy",
    "pytest",
    "ruff",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]
# Tests are functions here. Left on, collection grabs any imported class whose
# name starts with Test, and the domain has Testament.
python_classes = []
