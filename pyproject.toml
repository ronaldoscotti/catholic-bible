[project]
name = "catholic-bible"
version = "1.0.1"
description = "A read-only API and a published dataset for the Catholic Bible."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[project.scripts]
catholic-bible-api = "catholic_bible.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catholic_bible"]

[dependency-groups]
dev = [
    "httpx2",
    "mypy",
    "pytest",
    "ruff",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]
# Tests are functions here. Left on, collection grabs any imported class whose
# name starts with Test, and the domain has Testament.
python_classes = []
