name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run scripts/build-db.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run scripts/build-openapi.py --check
      - run: uv run pytest

  # Runs the README quickstart verbatim, minus the detach flags a runner needs,
  # and asserts against the response the README publishes rather than a subset
  # of it. A quickstart nobody executes rots within a month.
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker compose up -d --build --wait
      - name: The README response is the contract
        run: |
          expected=$(grep -m1 '^{"status"' README.md)
          actual=$(curl -sS --fail http://localhost:8000/health)
          echo "README $expected"
          echo "live   $actual"
          [ "$expected" = "$actual" ]
      - if: always()
        run: docker compose down
