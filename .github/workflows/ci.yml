name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  # Runs the README quickstart verbatim, minus the detach flags a runner needs.
  # A quickstart nobody executes rots within a month.
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build --wait
      - run: curl -sS --fail http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
      - if: always()
        run: docker compose down
