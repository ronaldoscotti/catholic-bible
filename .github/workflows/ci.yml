name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run scripts/build-db.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run scripts/lint-voice.py
      - run: uv run scripts/build-openapi.py --check
      - run: uv run scripts/build-artifacts.py --check
      - run: uv run pytest

  # Runs the README quickstart verbatim, minus the detach flags a runner needs,
  # and asserts against the response the README publishes rather than a subset
  # of it. A quickstart nobody executes rots within a month.
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker compose up -d --build --wait
      - name: The README response is the contract
        run: |
          expected=$(grep -m1 '^{"status"' README.md)
          actual=$(curl -sS --fail http://localhost:8000/health)
          echo "README $expected"
          echo "live   $actual"
          [ "$expected" = "$actual" ]
      - name: A stranger reads Sirach 24:1, which is the v1 gate
        run: |
          expected=$(grep -m1 '^{"id":"SIR.24.1"' README.md)
          actual=$(curl -sS --fail \
            http://localhost:8000/v1/versions/vulgata-clementina/books/SIR/chapters/24/verses/1)
          echo "README $expected"
          echo "live   $actual"
          [ "$expected" = "$actual" ]
          curl -sS --fail "http://localhost:8000/v1/resolve?ref=Eclo%2024,1" | grep -q SIR.24.1
      - name: The commentary answers in both languages and says who translated it
        run: |
          body=$(curl -sS --fail \
            http://localhost:8000/v1/books/JHN/chapters/3/verses/16/commentary)
          echo "$body" | grep -q '"language":"en-US"'
          echo "$body" | grep -q '"language":"pt-BR"'
          echo "$body" | grep -q '"translation":"machine"'
      - name: The OpenBible attribution travels with the data, which CC BY requires
        run: |
          body=$(curl -sS --fail \
            http://localhost:8000/v1/books/GEN/chapters/1/verses/1/cross-references)
          echo "$body" | grep -q 'OpenBible.info'
          echo "$body" | grep -q '"rights":"CC BY 4.0"'
      - name: Matthew quoting Wisdom, which no free set outside this one carries
        run: |
          curl -sS --fail "http://localhost:8000/v1/cross-references?ref=Mt%204,4" \
            | grep -q 'WIS.16.26'
      - if: always()
        run: docker compose down
