name: Release

# The tag is the trigger, never a laptop. `cdn.yml` already fires on the same
# tags and checks jsDelivr, so a release moves three published surfaces at once
# and each one proves itself separately.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tag names a version and `pyproject.toml` holds one. If they disagree,
  # nothing here should reach a registry, because a published version is
  # permanent and a wrong one cannot be taken back.
  agree:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: read
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -e "console.log(require('./package.json').version)")
          echo "tag says      $tagged"
          echo "manifest says $declared"
          case "$tagged" in
            "$declared"|"$declared"-*) ;;
            *) echo "the tag and the manifest disagree"; exit 1 ;;
          esac
          echo "version=$tagged" >> "$GITHUB_OUTPUT"

  pypi:
    needs: agree
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # OIDC. No token is stored anywhere for this.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv build --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: agree
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # OIDC, and provenance, which signs against this workflow.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # npm will not configure a trusted publisher for a name that has never
      # been published, and PyPI's pending publisher has no equivalent here. So
      # the first release authenticates with a token and every release after it
      # uses OIDC, which is what happens when the secret is absent.
      #
      # `NODE_AUTH_TOKEN` unset is not an error. The npm CLI prefers OIDC when
      # it is available and only falls back to a token, so the same step covers
      # the bootstrap and the steady state.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

  # A publish the registries accepted is not a package anybody can install.
  # Both propagate on their own schedule, which is why this retries rather than
  # trusting the step above, the same way `cdn.yml` retries jsDelivr.
  installed:
    needs: [agree, pypi, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: pip install, from the registry rather than from this checkout
        run: |
          version="${{ needs.agree.outputs.version }}"
          python -m venv /tmp/stranger
          for attempt in 1 2 3 4 5 6; do
            /tmp/stranger/bin/pip install --quiet \
              "the-catholic-bible==$version" && break
            echo "attempt $attempt did not resolve, waiting"
            sleep 30
          done
          /tmp/stranger/bin/python -c "
          from catholic_bible.canon.reference import parse_reference
          found = parse_reference('Eclo 24,1')
          print(found)
          assert found.book == 'SIR', found
          "

      - name: npm i, and the documented line runs against what was installed
        run: |
          version="${{ needs.agree.outputs.version }}"
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          for attempt in 1 2 3 4 5 6; do
            npm install --silent "the-catholic-bible@$version" && break
            echo "attempt $attempt did not resolve, waiting"
            sleep 30
          done
          node -e "
            const index = require('the-catholic-bible')
            const fs = require('fs')
            const path = require.resolve('the-catholic-bible')
                .replace(/index\.json$/, 'versions/matos-soares/books/SIR.json')
            const book = JSON.parse(fs.readFileSync(path, 'utf8'))
            const said = book.verses['SIR.24.1'].text
            if (!said) throw new Error('Sirach 24:1 is not in the published book')
            if (index.dataset_version !== '$version')
              throw new Error('the entry point names ' + index.dataset_version)
            console.log(index.books + ' books, ' + said.slice(0, 60))
          "
